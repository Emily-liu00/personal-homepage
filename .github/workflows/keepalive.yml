name: keep-supabase-awake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        run: |
          URL="https://etzwnxydbrqunhigktbd.supabase.co/rest/v1/feedback?select=id&limit=1"
          KEY="sb_publishable_kcZOivcqahwgPesoPIpXTw_3-ANS2i8"
          CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 30 "$URL" -H "apikey: $KEY")
          echo "HTTP $CODE"
          head -c 200 /tmp/body.txt || true
          echo
          case "$CODE" in
            200|206|401|403) echo "项目是醒着的";;
            *) echo "项目可能需要手动恢复"; exit 1;;
          esac
